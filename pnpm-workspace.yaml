packages:
  - apps/runner
  - apps/server
  - apps/web
  - oxlint-plugin-t3code
  - packages/*
  - scripts

# Successor to onlyBuiltDependencies/ignoredBuiltDependencies (pnpm 11).
# true = allowed to run build scripts; false mirrors the pnpm 10 behavior
# where anything outside onlyBuiltDependencies was silently not built.
allowBuilds:
  esbuild: true
  msw: false

catalog:
  "@clerk/backend": 3.18.1
  "@clerk/clerk-js": 6.32.1
  "@clerk/react": 6.16.1
  "@clerk/shared": 4.33.0
  "@effect/atom-react": 4.0.6
  "@effect/platform-node": 4.0.6
  "@effect/platform-node-shared": 4.0.6
  "@effect/sql-sqlite-node": 4.0.6
  "@effect/tsgo": 0.41.0
  "@effect/vitest": 4.0.6
  "@legendapp/list": 3.3.5
  "@opencode/client": 2.1.4
  "@opencode/protocol": 2.1.4
  "@opencode/schema": 2.1.4
  "@pierre/diffs": 1.3.0-beta.10
  "@tailwindcss/node": 4.3.3
  "@tailwindcss/oxide": 4.3.3
  "@tailwindcss/vite": 4.3.3
  "@types/node": 24.12.4
  effect: 4.0.6
  jose: 6.2.2
  lightningcss: 1.33.0
  tailwindcss: 4.3.3
  typescript: 7.0.2
  undici: 8.12.3
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
  ws: 8.22.0
  yaml: ^2.9.0

minimumReleaseAgeExclude:
  - "@clerk/backend@3.18.1"
  - "@clerk/clerk-js@6.32.1"
  - "@clerk/react@6.16.1"
  - "@clerk/shared@4.33.0"
  - "@legendapp/list@3.3.5"
  - "@shadcn/lint@0.1.5"
  - cn@0.3.2
  - "react@19.3.0"
  - "react-dom@19.3.0"

overrides:
  # Keep jsdom's optional peer consistent so Vite+ has one test-runner instance.
  "@exodus/bytes>@noble/hashes": "1.8.0"
  "@clerk/backend": "catalog:"
  "@clerk/clerk-js": "catalog:"
  "@clerk/clerk-js>@base-org/account": "-"
  "@clerk/clerk-js>@coinbase/wallet-sdk": "-"
  "@clerk/clerk-js>@solana/wallet-adapter-base": "-"
  "@clerk/clerk-js>@solana/wallet-adapter-react": "-"
  "@clerk/clerk-js>@solana/wallet-standard": "-"
  "@clerk/clerk-js>@wallet-standard/core": "-"
  "@clerk/react": "catalog:"
  "@clerk/shared": "catalog:"
  "@effect/atom-react": "catalog:"
  "@effect/platform-node": "catalog:"
  "@effect/platform-node-shared": "catalog:"
  "@effect/sql-sqlite-node": "catalog:"
  "@effect/vitest": "catalog:"
  "@effect/vitest>vitest": "-"
  "@pierre/diffs>@shikijs/transformers": ^4.2.0
  # Keep one copy of these native-binary packages. lightningcss ships 11 platform binaries per
  # version, and the workspaces' tailwindcss ^4 ranges drift into two 4.3.x copies of the family.
  "@tailwindcss/node": "catalog:"
  "@tailwindcss/oxide": "catalog:"
  "@tailwindcss/vite": "catalog:"
  "@types/node": "catalog:"
  # OpenCode's protocol and schema packages pin an exact Effect as a dependency,
  # and their schemas fail to decode under a second Effect copy.
  effect: "catalog:"
  lightningcss: "catalog:"
  tailwindcss: "catalog:"
  # Ranges from @effect/platform-node, jsdom and Vitest browser mode otherwise
  # settle on two patch releases of each major. Older majors stay as they are.
  "undici@^8": "catalog:"
  "ws@^8": "catalog:"
  "ws>bufferutil": "-"
  "ws>utf-8-validate": "-"
  vite: "catalog:"
  vite-plus: "catalog:"
  yaml: "catalog:"

packageExtensions:
  # Our patch makes @effect/vitest import vite-plus/test. A catalog: spec here
  # resolves through the vite-plus override above.
  "@effect/vitest@*":
    dependencies:
      vite-plus: "catalog:"

patchedDependencies:
  "@effect/vitest@4.0.6": patches/@effect__vitest@4.0.6.patch
  "@legendapp/list@3.3.5": patches/@legendapp__list@3.3.5.patch

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

supportedArchitectures:
  cpu: [current, x64]
  libc: [current, glibc]
  os: [current, linux]
